version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      localization:
        patterns: ['i18next', 'react-i18next']
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      react-runtime:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      eslint:
        patterns: ['eslint', '@eslint/js', 'eslint-plugin-*']
    ignore:
      # plugin-react 6 requires Vite 8; migrate the toolchain as one change.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /memora-pomodoro
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      react-runtime:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
    ignore:
      # electron-vite 5 supports Vite 5/6/7, not Vite 8.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /services/memora-wallet-manager
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
