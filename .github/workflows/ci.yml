name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 2 * * 3'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - run: bash -n deploy/vps/memora-update.sh && bash deploy/vps/test-memora-update.sh

  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s services/memora-wallet-manager/tests -v
      - run: python3 -m py_compile services/memora-wallet-manager/bot.py services/memora-wallet-manager/storage.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check server.js && for file in server/*.js; do node --check "$file"; done
      - run: npm run test:deals
      - run: npm run test:payments
      - run: npm run test:reliability
      - run: npm run lint
      - run: npm run build

  pomodoro:
    runs-on: ubuntu-latest
    env:
      MEMORA_SCENE_KEY: ${{ secrets.MEMORA_SCENE_KEY }}
    defaults:
      run:
        working-directory: memora-pomodoro
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: memora-pomodoro/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - name: Build public desktop and web without credentials
        run: npm run build:public && npm run build:web:public
      - run: npm run build
        if: env.MEMORA_SCENE_KEY != ''
      - run: npm run build:web
        if: env.MEMORA_SCENE_KEY != ''

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
