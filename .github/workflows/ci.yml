name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --check server.js && for file in server/*.js; do node --check "$file"; done
      - run: npm run test:deals
      - run: npm run test:payments
      - run: npm run lint
      - run: npm run build

  pomodoro:
    runs-on: ubuntu-latest
    env:
      MEMORA_SCENE_KEY: ${{ secrets.MEMORA_SCENE_KEY }}
    defaults:
      run:
        working-directory: memora-pomodoro
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: memora-pomodoro/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:web
