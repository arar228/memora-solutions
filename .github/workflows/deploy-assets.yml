name: Deploy production assets

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
        env:
          VITE_ASSET_BASE: https://arar228.github.io/memora-solutions/

      - name: Publish immutable assets to CDN branch
        run: |
          git clone --depth 1 --branch cdn \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cdn-release

          # Vite gives production files content hashes. Keep earlier hashes so an
          # already opened tab can finish loading after the next deployment.
          rsync --archive dist/ cdn-release/

          cd cdn-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --allow-empty -m "assets: ${GITHUB_SHA}"
          git push origin HEAD:cdn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir pages-release
          rsync --archive --exclude='.git/' cdn-release/ pages-release/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-release

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production assets
        id: deployment
        uses: actions/deploy-pages@v4
