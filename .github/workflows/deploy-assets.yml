name: Deploy production assets

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm run lint
          npm run test:deals
          npm run test:payments
          npm run test:reliability

      - name: Build production assets
        working-directory: memora-pomodoro
        run: |
          npm ci
          npx tsc --noEmit
          npm run build:web
        env:
          MEMORA_SCENE_KEY: ${{ secrets.MEMORA_SCENE_KEY }}

      - name: Build website with current Pomodoro assets
        run: npm run build
        env:
          VITE_ASSET_BASE: ./

      - name: Publish immutable assets to CDN branch
        run: |
          git clone --depth 1 --branch cdn \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cdn-release

          # Vite gives production files content hashes. Keep earlier hashes so an
          # already opened tab can finish loading after the next deployment.
          rsync --archive dist/ cdn-release/

          cd cdn-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --allow-empty -m "assets: ${GITHUB_SHA}"
          git push origin HEAD:cdn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir pages-release
          rsync --archive --exclude='.git/' cdn-release/ pages-release/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-release

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production assets
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
