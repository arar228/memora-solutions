name: Deploy VPS

on:
  workflow_run:
    workflows: ["Deploy production assets"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verify host and deploy
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: 23.94.105.127
          VPS_PORT: '22'
          VPS_FINGERPRINT: SHA256:nLvPFGCkQO01+MrsLWHZkCsgMI7BOU9b6nRAzQ/zMGU
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TRAVELPAYOUTS_TRS: '547927'
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_PASSWORD"
          test -n "$TRAVELPAYOUTS_TOKEN"
          test -n "$TRAVELPAYOUTS_MARKER"
          test -n "$YOOKASSA_SHOP_ID"
          test -n "$YOOKASSA_SECRET_KEY"
          install -d -m 700 "$HOME/.ssh"

          host_keys=''
          for attempt in 1 2 3 4 5; do
            host_keys=$(ssh-keyscan -T 10 -p "$VPS_PORT" "$VPS_HOST" 2>/dev/null || true)
            [ -n "$host_keys" ] && break
            sleep 3
          done
          test -n "$host_keys"

          actual_fingerprints=$(printf '%s\n' "$host_keys" | ssh-keygen -lf - -E sha256 | awk '{ print $2 }')
          if ! printf '%s\n' "$actual_fingerprints" | grep -Fxq "$VPS_FINGERPRINT"; then
            echo "::error::VPS host fingerprint mismatch"
            exit 1
          fi
          printf '%s\n' "$host_keys" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          export SSHPASS="$VPS_PASSWORD"
          affiliate_env=$(mktemp)
          trap 'rm -f "$affiliate_env"' EXIT
          {
            printf 'TRAVELPAYOUTS_TOKEN=%s\n' "$TRAVELPAYOUTS_TOKEN"
            printf 'TRAVELPAYOUTS_MARKER=%s\n' "$TRAVELPAYOUTS_MARKER"
            printf 'TRAVELPAYOUTS_TRS=%s\n' "$TRAVELPAYOUTS_TRS"
            printf 'YOOKASSA_SHOP_ID=%s\n' "$YOOKASSA_SHOP_ID"
            printf 'YOOKASSA_SECRET_KEY=%s\n' "$YOOKASSA_SECRET_KEY"
          } > "$affiliate_env"
          chmod 600 "$affiliate_env"
          sshpass -e scp \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -P "$VPS_PORT" \
            "$affiliate_env" \
            "root@$VPS_HOST:/tmp/memora-travelpayouts.env"
          sshpass -e ssh \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -p "$VPS_PORT" \
            "root@$VPS_HOST" \
            'set -euo pipefail
             app_dir=/opt/memora-solutions
             runuser -u memora -- git -C "$app_dir" fetch origin master
             update_tmp=$(mktemp)
             caddy_tmp=$(mktemp)
             env_tmp=$(mktemp)
             trap '\''rm -f "$update_tmp" "$caddy_tmp" "$env_tmp" /tmp/memora-travelpayouts.env'\'' EXIT
             grep -Ev '\''^(TRAVELPAYOUTS_TOKEN|TRAVELPAYOUTS_MARKER|TRAVELPAYOUTS_TRS|YOOKASSA_SHOP_ID|YOOKASSA_SECRET_KEY)='\'' /etc/memora-solutions.env > "$env_tmp" || true
             cat /tmp/memora-travelpayouts.env >> "$env_tmp"
             install -o root -g memora -m 0640 "$env_tmp" /etc/memora-solutions.env
             git -c safe.directory="$app_dir" -C "$app_dir" show origin/master:deploy/vps/memora-update.sh > "$update_tmp"
             git -c safe.directory="$app_dir" -C "$app_dir" show origin/master:deploy/vps/memora-solutions.caddy > "$caddy_tmp"
             install -o root -g root -m 0755 "$update_tmp" /usr/local/sbin/memora-update
             caddy validate --config "$caddy_tmp" --adapter caddyfile
             install -o root -g root -m 0644 "$caddy_tmp" /etc/caddy/Caddyfile
             systemctl reload caddy
             systemctl start memora-update.service
             test "$(systemctl show -p Result --value memora-update.service)" = success
             systemctl is-active --quiet memora-solutions.service
             git -c safe.directory="$app_dir" -C "$app_dir" rev-parse HEAD'
