name: Deploy Wallet Manager

on:
  push:
    branches: [master]
    paths:
      - 'services/memora-wallet-manager/**'
      - '.github/workflows/deploy-wallet-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-manager-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare key authentication
        id: ssh
        uses: ./.github/actions/setup-vps-ssh
        with:
          private-key: ${{ secrets.MEMORA_VPS_SSH_KEY }}
          host: 23.94.105.127
          port: '22'
          fingerprint: SHA256:nLvPFGCkQO01+MrsLWHZkCsgMI7BOU9b6nRAzQ/zMGU

      - name: Prepare release
        env:
          WALLET_BOT_TOKEN: ${{ secrets.WALLET_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WALLET_BOT_TOKEN"
          python3 -m unittest discover -s services/memora-wallet-manager/tests -v
          python3 -m py_compile services/memora-wallet-manager/bot.py services/memora-wallet-manager/storage.py
          tar -C services/memora-wallet-manager \
            --exclude='__pycache__' \
            -czf /tmp/memora-wallet-manager.tgz .
          umask 077
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$WALLET_BOT_TOKEN" > /tmp/memora-wallet-manager.env

      - name: Deploy isolated bot service
        env:
          VPS_SSH_KEY_FILE: ${{ steps.ssh.outputs.key-path }}
          VPS_KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known-hosts-path }}
          VPS_HOST: 23.94.105.127
          VPS_PORT: '22'
        run: |
          set -euo pipefail
          test -s "$VPS_SSH_KEY_FILE"
          scp -i "$VPS_SSH_KEY_FILE" -P "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$VPS_KNOWN_HOSTS_FILE" -o HostKeyAlgorithms=ssh-ed25519 \
            /tmp/memora-wallet-manager.tgz /tmp/memora-wallet-manager.env \
            "root@$VPS_HOST:/tmp/"

          ssh -i "$VPS_SSH_KEY_FILE" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$VPS_KNOWN_HOSTS_FILE" -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 "root@$VPS_HOST" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          wallet_debug() {
            systemctl show memora-wallet-manager.service -p ActiveState -p SubState -p Result -p NRestarts || true
            journalctl -u memora-wallet-manager.service -n 80 --no-pager \
              | sed -E 's/[0-9]{8,}:[A-Za-z0-9_-]{20,}/[REDACTED_BOT_TOKEN]/g; s/\(Update:.*$/[UPDATE_REDACTED]/' || true
          }
          wallet_switched=0
          wallet_stopped=0
          wallet_was_active=0
          systemctl is-active --quiet memora-wallet-manager.service && wallet_was_active=1
          wallet_config_backup=$(mktemp -d /var/backups/memora-wallet-config.XXXXXX)
          chmod 700 "$wallet_config_backup"
          for file in /etc/memora-wallet-manager.env /etc/systemd/system/memora-wallet-manager.service; do
            if [ -f "$file" ]; then cp -a "$file" "$wallet_config_backup/"; fi
          done
          wallet_rollback() {
            result=$?
            trap - ERR
            wallet_debug
            if [ "$wallet_switched" -eq 1 ]; then
              systemctl stop memora-wallet-manager.service || true
              if [ -d /opt/memora-wallet-manager ]; then
                mv /opt/memora-wallet-manager "$wallet_config_backup/failed-release"
              fi
              if [ -d /opt/memora-wallet-manager.previous ]; then
                mv /opt/memora-wallet-manager.previous /opt/memora-wallet-manager
              fi
              if [ -f "$wallet_config_backup/memora-wallet-manager.env" ]; then
                cp -a "$wallet_config_backup/memora-wallet-manager.env" /etc/memora-wallet-manager.env
              fi
              if [ -f "$wallet_config_backup/memora-wallet-manager.service" ]; then
                cp -a "$wallet_config_backup/memora-wallet-manager.service" /etc/systemd/system/memora-wallet-manager.service
              fi
              systemctl daemon-reload
            fi
            if [ "$wallet_stopped" -eq 1 ] && [ "$wallet_was_active" -eq 1 ]; then
              systemctl start memora-wallet-manager.service || true
              systemctl is-active --quiet memora-wallet-manager.service || echo '::error::Wallet rollback needs operator attention'
            fi
            exit "$result"
          }
          trap wallet_rollback ERR

          apt-get update -qq
          apt-get install -y -qq python3-venv

          id -u memora-wallet >/dev/null 2>&1 || useradd \
            --system --home-dir /var/lib/memora-wallet-manager \
            --shell /usr/sbin/nologin memora-wallet
          install -d -o memora-wallet -g memora-wallet -m 750 /var/lib/memora-wallet-manager
          install -d -o root -g root -m 700 /var/backups/memora-wallet-manager
          install -d -o root -g root -m 755 /opt/memora-wallet-manager
          rm -rf /opt/memora-wallet-manager.release
          install -d -o root -g root -m 755 /opt/memora-wallet-manager.release
          tar -xzf /tmp/memora-wallet-manager.tgz -C /opt/memora-wallet-manager.release

          python3 -m venv /opt/memora-wallet-manager.release/.venv
          /opt/memora-wallet-manager.release/.venv/bin/pip install \
            --disable-pip-version-check --no-cache-dir -r /opt/memora-wallet-manager.release/requirements.txt
          /opt/memora-wallet-manager.release/.venv/bin/python -m py_compile \
            /opt/memora-wallet-manager.release/bot.py /opt/memora-wallet-manager.release/storage.py
          /opt/memora-wallet-manager.release/.venv/bin/python -m unittest discover \
            -s /opt/memora-wallet-manager.release/tests -v

          # Validate the existing database as the service user. Only a boolean
          # result is emitted; no financial records are copied into Actions logs.
          runuser -u memora-wallet -- /opt/memora-wallet-manager.release/.venv/bin/python -c '
          import json, pathlib, sys
          sys.path.insert(0, "/opt/memora-wallet-manager.release")
          from storage import normalize_user_data
          path = pathlib.Path("/var/lib/memora-wallet-manager/user_data.json")
          if path.exists():
              normalize_user_data(json.loads(path.read_bytes()))
          elif path.with_suffix(".initialized").exists():
              raise RuntimeError("Wallet data file is missing; restore required")
          print("Wallet data compatibility: OK")'

          if systemctl cat memora-wallet-manager.service >/dev/null 2>&1; then
            systemctl stop memora-wallet-manager.service
          fi
          wallet_stopped=1
          # Snapshot after the writer stops; retain all prior restore points.
          tar -C /var/lib -czf "$wallet_config_backup/data.tgz" memora-wallet-manager
          chmod 600 "$wallet_config_backup/data.tgz"
          rm -rf /opt/memora-wallet-manager.previous
          if [ -d /opt/memora-wallet-manager ]; then
            mv /opt/memora-wallet-manager /opt/memora-wallet-manager.previous
          fi
          wallet_switched=1
          mv /opt/memora-wallet-manager.release /opt/memora-wallet-manager
          install -o root -g root -m 600 /tmp/memora-wallet-manager.env /etc/memora-wallet-manager.env
          install -o root -g root -m 644 \
            /opt/memora-wallet-manager/memora-wallet-manager.service \
            /etc/systemd/system/memora-wallet-manager.service
          rm -f /tmp/memora-wallet-manager.tgz /tmp/memora-wallet-manager.env

          systemctl daemon-reload
          systemctl enable --now memora-wallet-manager.service
          sleep 12
          systemctl is-active --quiet memora-wallet-manager.service

          first_pid=$(systemctl show -p MainPID --value memora-wallet-manager.service)
          first_restarts=$(systemctl show -p NRestarts --value memora-wallet-manager.service)
          test "$first_pid" -gt 0

          # A polling conflict or a bad token can leave systemd briefly active
          # while the bot is actually restarting every few seconds.  Observe a
          # second interval so a successful deploy means a stable bot process.
          sleep 12
          systemctl is-active --quiet memora-wallet-manager.service
          second_pid=$(systemctl show -p MainPID --value memora-wallet-manager.service)
          second_restarts=$(systemctl show -p NRestarts --value memora-wallet-manager.service)
          test "$second_pid" -eq "$first_pid"
          test "$second_restarts" -eq "$first_restarts"

          trap - ERR
          REMOTE
