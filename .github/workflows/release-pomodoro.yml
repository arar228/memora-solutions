name: Release Pomodoro

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example pomodoro-v1.4.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      MEMORA_SCENE_KEY: ${{ secrets.MEMORA_SCENE_KEY }}
    defaults:
      run:
        working-directory: memora-pomodoro
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: memora-pomodoro/package-lock.json

      - run: npm ci
      - run: npm run dist:win -- --publish never

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $installer = Resolve-Path 'release/Memora-Pomodoro-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Memora-Pomodoro-Setup.exe" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Memora Pomodoro $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/Memora-Pomodoro-Setup.exe release/SHA256SUMS.txt --clobber
