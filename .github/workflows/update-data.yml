name: Update public travel data

# Refresh rate-limited Travelpayouts feeds separately from Telegram channels.

on:
  schedule:
    # The provider rate-limits the large route matrix; a three-hour cycle is
    # sufficient for reference prices and no longer blocks the live deal feed.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-public-travel-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build price radar
        id: radar
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TP_CURRENCY: rub
          TP_MARKET: ru
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "TRAVELPAYOUTS_TOKEN is not set; skipping radar."
            exit 0
          fi
          node scripts/fetch-radar.js

      - name: Fetch hot flights
        id: flights
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TP_CURRENCY: rub
          TP_MARKET: ru
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "TRAVELPAYOUTS_TOKEN is not set; skipping flights."
            exit 0
          fi
          node scripts/fetch-flights.js

      - name: Validate generated feeds
        id: validate
        continue-on-error: true
        run: node scripts/validate-feeds.js radar flights

      - name: Commit refreshed feeds
        if: always()
        run: |
          if [ -f .feed-validation-fatal ]; then
            echo "Feed validation could not restore a last-known-good file; refusing to commit." >&2
            exit 1
          fi

          if [[ -z "$(git status --porcelain public/flights.json public/radar.json)" ]]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flights.json public/radar.json
          git commit -m "chore(data): refresh travel feeds [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "push attempt $i rejected; rebasing and retrying"
            sleep $((RANDOM % 5 + 3))
          done

          echo "failed to push refreshed feeds after 5 attempts" >&2
          exit 1

      - name: Report partial failures
        if: always() && (steps.radar.outcome == 'failure' || steps.flights.outcome == 'failure' || steps.validate.outcome == 'failure')
        run: |
          echo "One or more feed refresh or validation steps failed. Valid feeds were still committed; invalid feeds were restored."
          exit 1
