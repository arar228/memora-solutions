name: Update hot flights (Travelpayouts)

# Pulls the cheapest recent tickets from the Travelpayouts Data API, scores them
# vs the route median, and (optionally) posts new hot deals to the Telegram
# channel + refreshes public/flights.json. Runs only when the TRAVELPAYOUTS_TOKEN
# repo secret is set, so it doesn't fail before the API is connected.

on:
  schedule:
    # Every 2 hours (UTC), offset from the tours feed. Data API is cached anyway.
    - cron: '30 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch hot flights
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TP_CURRENCY: rub
          TP_MARKET: ru
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "TRAVELPAYOUTS_TOKEN secret not set — skipping (add it in repo Settings → Secrets to enable)."
            exit 0
          fi
          node scripts/fetch-flights.js

      - name: Commit updated flights feed
        run: |
          if [[ -z "$(git status --porcelain public/flights.json)" ]]; then
            echo "No flights changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flights.json
          git commit -m "chore(flights): refresh hot flights [skip ci]"
          git push
