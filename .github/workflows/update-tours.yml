name: Update Travel Radar feed

# Scrapes public Telegram travel channels and refreshes public/tours.json.
# The site reads that file as a static feed, so this keeps deals fresh
# without any backend.

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs under load.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-tours
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch tours + structure deals
        run: |
          node scripts/fetch-tours.js
          node scripts/parse-deals.js

      - name: Commit updated feed
        run: |
          if [[ -z "$(git status --porcelain public/tours.json public/hot-deals.json)" ]]; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tours.json public/hot-deals.json
          git commit -m "chore(travel): refresh tours + deals feed [skip ci]"
          # Other feed crons push to master too; rebase + retry to avoid a
          # non-fast-forward rejection dropping the run.
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "push attempt $i rejected — rebasing and retrying"
            sleep $((RANDOM % 5 + 3))
          done
          echo "failed to push tours feed after 5 attempts" >&2
          exit 1
