name: Update Travel Radar channels

on:
  schedule:
    # Every 30 minutes, shifted away from the top of the hour.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-travel-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED_BASE_REF: refs/remotes/origin/travel-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Load last-known-good data
        run: node scripts/travel-feed-branch.mjs prepare

      - name: Fetch every Telegram channel
        run: node scripts/fetch-tours.js

      - name: Structure deals
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TRAVELPAYOUTS_TRS: '547927'
        run: node scripts/parse-deals.js

      - name: Test parser
        run: npm run test:deals

      - name: Validate Telegram feeds
        run: node scripts/validate-feeds.js tours hot-deals

      - name: Publish validated data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/travel-feed-branch.mjs publish tours hot-deals
