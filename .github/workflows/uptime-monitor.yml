name: Uptime monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production health
        run: |
          for attempt in 1 2 3; do
            html="$(mktemp)"
            bundle="$(mktemp)"
            status="$(curl --location --silent --show-error \
              --header 'Cache-Control: no-cache' \
              --output "$html" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              "https://memorasolutions.ru/?uptime=${GITHUB_RUN_ID}-${attempt}" || true)"

            if [ "$status" = "200" ]; then
              entry="$(sed -n 's/.*<meta name="memora-entry" content="\([^"]*\)".*/\1/p' "$html" | head -n 1)"

              if [ -n "$entry" ]; then
                for base in \
                  'https://memorasolutions.ru/' \
                  'https://arar228.github.io/memora-solutions/' \
                  'https://cdn.jsdelivr.net/gh/arar228/memora-solutions@cdn/'; do
                  entry_url="${base}${entry}"
                  bundle_status="$(curl --location --silent --show-error \
                    --header 'Cache-Control: no-cache' \
                    --output "$bundle" --write-out '%{http_code}' \
                    --connect-timeout 8 --max-time 15 \
                    "$entry_url" || true)"

                  if [ "$bundle_status" = "200" ] && [ -s "$bundle" ]; then
                    echo "Production HTML and resilient entry source are healthy: $base"
                    exit 0
                  fi

                  echo "Attempt $attempt: $entry_url returned HTTP $bundle_status."
                done
              else
                echo "Attempt $attempt: resilient entry metadata was not found in production HTML."
              fi
            else
              echo "Attempt $attempt: production HTML returned HTTP $status."
            fi

            sleep 10
          done

          echo "Production frontend check failed three times." >&2
          exit 1
