name: Uptime monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production health
        run: |
          for attempt in 1 2 3; do
            status="$(curl --location --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 \
              https://memorasolutions.ru/health || true)"

            if [ "$status" = "200" ]; then
              echo "Production is healthy."
              exit 0
            fi

            echo "Attempt $attempt returned HTTP $status."
            sleep 10
          done

          echo "Production healthcheck failed three times." >&2
          exit 1
