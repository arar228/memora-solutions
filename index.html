<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --color-bg: #1a1a1e;
      --color-gold: #06b6d4;
      --color-green: #10b981;
    }

    body {
      margin: 0;
      background: var(--color-bg);
    }

    .global-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
    }

    .loader-logo {
      position: absolute;
      width: 60px;
      height: 60px;
      object-fit: contain;
      animation: memora-pulse 2s infinite ease-in-out;
    }

    .loader-circle {
      width: 100px;
      height: 100px;
      border: 3px solid transparent;
      border-top-color: var(--color-gold);
      border-right-color: var(--color-green);
      border-radius: 50%;
      animation: memora-spin 1.5s linear infinite;
    }

    @keyframes memora-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes memora-pulse {
      50% { transform: scale(0.85); opacity: 0.7; }
    }

    .global-loader__failure {
      box-sizing: border-box;
      width: min(560px, calc(100vw - 40px));
      padding: 28px;
      border: 1px solid rgba(49, 199, 217, 0.35);
      border-radius: 20px;
      background: #1f2025;
      color: #f3f3f1;
      font: 18px/1.45 Arial, sans-serif;
      text-align: left;
    }

    .global-loader__failure strong {
      display: block;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .global-loader__retry {
      display: inline-flex;
      margin-top: 20px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: #31c7d9;
      color: #101115;
      font: 700 18px/1 Arial, sans-serif;
      cursor: pointer;
    }
  </style>
  <script src="/boot.js"></script>

  <link rel="icon" type="image/webp" href="/logo-loader.webp?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://arar228.github.io" crossorigin />
  <link rel="dns-prefetch" href="https://arar228.github.io" />
  <meta name="description"
    content="Мемора Солюшнс — цифровые инструменты для улучшения качества жизни. Радар путешествий, планирование, помощь в отношениях." />
  <meta name="theme-color" content="#1A1A1E" />
  <title>Мемора Солюшнс | Memora Solutions</title>
  <link rel="canonical" href="https://memorasolutions.ru/" />

  <!-- Open Graph (link previews in Telegram, WhatsApp, Slack, etc.) -->

  <meta property="og:title" content="Мемора Солюшнс | Memora Solutions" />

    content="Цифровые инструменты для улучшения качества жизни. Радар путешествий, планирование, помощь в отношениях." />
  <meta property="og:url" content="https://memorasolutions.ru/" />

  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />

  <meta name="twitter:card" content="summary_large_image" />
