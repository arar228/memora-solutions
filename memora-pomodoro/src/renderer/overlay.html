<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" />
  <title>Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; overflow: hidden; background: transparent !important; }
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: transparent;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    :root {
      --a: #E05A33;
      --brk: #1D9E75;
      --bg: #0F0F14;
      --sf: #17171C;
      --sf2: #24242B;
      --bd: rgba(255,255,255,0.14);
      --t1: #F2F0EB;
      --t2: #A19FA5;
      --t3: #626169;
    }

    /* ========== SHARED ========== */
    .ov {
      display: flex;
      align-items: center;
      /* Hug the content so the widget (and the window measured from it) has no
         wasted space — instead of stretching to the full window width. */
      width: fit-content;
      cursor: move;
      box-shadow: 0 8px 24px rgba(0,0,0,0.34);
      transition: box-shadow 200ms ease, border-color 200ms ease, transform 200ms ease;
    }
    .ov:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.42); }
    .ov.no-bg { background: transparent !important; border-color: transparent !important; backdrop-filter: none !important; }
    .ov button:focus-visible { outline: 1px solid var(--a); outline-offset: 2px; }
    .ov button:disabled { opacity: 0.42; cursor: default; }

    /* Time-up alert: blink the widget a contrasting red (OS notifications get ignored). */
    .ov-flash { animation: ovFlash 0.7s steps(1, end) infinite !important; }
    @keyframes ovFlash {
      0%, 49%   { box-shadow: 0 0 0 2px rgba(230,64,64,0); }
      50%, 100% { background: rgba(230,64,64,0.55) !important; box-shadow: 0 0 0 2px rgba(230,64,64,0.95), 0 0 22px rgba(230,64,64,0.75); }
    }

    /* ========== PILL (micro) ~120×32 ========== */
    .ov-pill {
      gap: 6px;
      padding: 4px 6px 4px 4px;
      background: linear-gradient(180deg, #15151B, var(--bg));
      border-radius: 20px;
      border: 1px solid var(--bd);
      backdrop-filter: blur(12px);
    }
    .ov-pill-icon {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--a);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .ov-pill-icon img { width: 18px; height: 18px; object-fit: contain; }
    .ov-mini-ring { flex-shrink: 0; }
    .ov-mini-ring svg { transform: rotate(-90deg); }
    .ov-pill-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 600;
      color: var(--t1); min-width: 42px;
    }
    .ov-pill-btn {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--bd);
      background: var(--sf);
      color: var(--t2); cursor: pointer;
      transition: all 150ms ease;
      padding: 0; flex-shrink: 0;
    }
    .ov-pill-btn:hover { border-color: var(--a); color: var(--t1); }

    /* ========== COMPACT (default) ~220×52 ========== */
    .ov-compact {
      gap: 10px;
      padding: 8px 12px;
      background: linear-gradient(180deg, #15151B, var(--bg));
      border-radius: 12px;
      border: 1px solid var(--bd);
      backdrop-filter: blur(12px);
    }
    .ov-ring-wrap {
      position: relative; width: 36px; height: 36px; flex-shrink: 0;
    }
    .ov-ring-wrap svg { transform: rotate(-90deg); }
    .ov-pct {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 700; color: var(--t1);
    }
    .ov-info {
      display: flex; flex-direction: column; gap: 1px; min-width: 50px;
    }
    .ov-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px; font-weight: 700; color: var(--t1);
      letter-spacing: -1px; line-height: 1;
    }
    .ov-mode {
      font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--t2); line-height: 1;
    }
    .ov-controls { display: flex; gap: 4px; margin-left: 4px; }
    .ov-btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--bd);
      background: var(--sf);
      color: var(--t2); cursor: pointer;
      transition: all 150ms ease; padding: 0;
    }
    .ov-btn:hover { border-color: var(--a); color: var(--t1); }
    .ov-btn-play {
      width: 28px; height: 28px;
      border: none; color: white;
    }
    .ov-btn-play:hover { transform: scale(1.08); }

    /* ========== BAR (wide) ~340×30 ========== */
    .ov-bar {
      gap: 8px;
      padding: 6px 12px;
      background: linear-gradient(180deg, #15151B, var(--bg));
      border-radius: 10px;
      border: 1px solid var(--bd);
      backdrop-filter: blur(12px);
    }
    .ov-bar-logo {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--a);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 600; color: #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .ov-bar-logo img { width: 14px; height: 14px; object-fit: contain; }
    .ov-bar-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px; font-weight: 600; color: var(--t1);
    }
    .ov-bar-progress {
      width: 80px; height: 3px;
      background: var(--sf2); border-radius: 2px;
      overflow: hidden; flex-shrink: 0;
    }
    .ov-bar-fill {
      height: 100%;
      border-radius: 2px; transition: width 1s linear;
    }
    .ov-bar-mode {
      font-size: 10px; font-weight: 500;
      color: var(--t2);
    }
    .ov-bar-sep {
      width: 0.5px; height: 14px;
      background: var(--bd); flex-shrink: 0;
    }
    .ov-bar-dots { display: flex; gap: 3px; align-items: center; }
    .ov-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--sf2);
      transition: background 200ms ease;
    }
    .ov-dot.done { background: var(--a); }
    .ov-dot.cur { background: var(--a); box-shadow: 0 0 4px rgba(224,90,51,0.4); }
    .ov-bar-controls {
      display: flex; gap: 3px; margin-left: auto;
    }
    .ov-bar-btn {
      color: var(--t2); font-size: 10px; cursor: pointer;
      display: grid; place-items: center;
      width: 22px; height: 22px;
      border-radius: 6px;
      background: var(--sf); border: 1px solid var(--bd); padding: 2px;
      transition: color 150ms ease;
    }
    .ov-bar-btn:hover { color: var(--t1); border-color: var(--a); }

    @media (prefers-reduced-motion: reduce) {
      .ov, .ov *, .ov-flash { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./overlay-entry.tsx"></script>
</body>
</html>
